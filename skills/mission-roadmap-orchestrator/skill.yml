name: mission-roadmap-orchestrator
version: "1.0.0"
layer: core-doctrine
priority: 4
description: >
  Turns any project into a roadmap, next gates, branches, risks,
  and compounding execution path. This is the strategic execution engine —
  it converts vision into structured, actionable paths with decision points.

input:
  description: >
    Any project, mission, goal, or vision that needs to be converted into
    an executable roadmap with gates, risks, and compounding structure.
  examples:
    - "Project brief needing roadmap decomposition"
    - "Vision statement needing execution path"
    - "Existing roadmap needing risk analysis and gate structure"
    - "Multi-branch initiative needing orchestration"
    - "Stalled project needing next-gate identification"
  formats:
    - text
    - markdown
    - project-brief
    - vision-statement
    - existing-roadmap

output:
  description: >
    Complete execution architecture: roadmap with phases, gates between phases,
    branch points, risk registry, and compounding path showing how early work
    enables later work.
  formats:
    - roadmap-document
    - structured-markdown
    - json
    - mermaid-diagram
  schema:
    roadmap:
      mission_statement: string
      success_criteria: list
      phases:
        - name: string
          objective: string
          deliverables: list
          duration_estimate: string
          dependencies: list
          gate:
            name: string
            criteria: list
            decision_type: "pass | conditional | branch | kill"
      branches:
        - name: string
          trigger_condition: string
          path: list
          merge_point: string
      risks:
        - description: string
          probability: "low | medium | high"
          impact: "low | medium | high | critical"
          mitigation: string
          owner: string
      compounding_path:
        description: string
        leverage_points: list
        accumulation_mechanism: string

connectors:
  - type: files
    description: "Read project inputs, write roadmap artifacts"
  - type: github
    description: "Create issues, milestones, and project boards from roadmap phases"
  - type: spreadsheets
    description: "Resource allocation, timeline visualization, risk matrices"
  - type: drive
    description: "Access project briefs, prior roadmaps, and reference materials"

orchestration_principles:
  - name: gates-not-deadlines
    description: "Progress is measured by gate criteria met, not calendar dates"
  - name: branch-aware
    description: "Every roadmap acknowledges that paths fork — plan for it"
  - name: compound-sequencing
    description: "Order work so early outputs enable and amplify later phases"
  - name: risk-forward
    description: "Identify risks early, assign them, and build mitigation into the path"
  - name: kill-criteria
    description: "Every initiative has explicit conditions under which it should be stopped"

dependencies:
  - medina-operating-system
  - anti-drift-reviewer

downstream_skills:
  - resource-hub-organizer
  - organism-company-builder
  - company-genesis-engine
  - project-ops-chief
  - synthetic-entity-productizer
